[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"
[project]
name = "kinopio-hub"
version = "3.0.0"
readme = "README.md"
license = "GPL-3.0-or-later"
authors = [{name = "skyboooox"}]
description = "Shared RAM variables, events and request/reply over NATS Core"
requires-python = ">=3.10"
dependencies = ["nats-py==2.15.0", "aiohttp==3.14.3", "psutil==7.2.2", "rfc8785==0.1.4", "async-timeout==5.0.1; python_version < '3.11'"]
[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=1", "ruff>=0.12", "mypy>=1.15", "build>=1.2", "types-psutil"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
[tool.mypy]
files = ["src"]
check_untyped_defs = true

[tool.hatch.build.targets.wheel]
packages = ["src/kinopio_hub"]
[tool.hatch.build.targets.sdist]
include = ["src/kinopio_hub", "examples", "README.md", "README_CN.md", "LICENSE", "pyproject.toml", "uv.lock"]
